<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Chatbot</title>
  <meta name="description" content="A browser-based AI chatbot built with HTML, CSS and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>AI Chatbot</h1>
        <p class="sub">Ask a question and get an answer in seconds.</p>
      </div>
      <button id="clear" class="ghost" type="button">New chat</button>
    </header>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversation">
      <div id="empty" class="empty">
        <p class="empty-title">What do you want to know?</p>
        <div class="chips">
          <button class="chip" type="button">Explain recursion in simple words</button>
          <button class="chip" type="button">Give me a 3-day study plan for DSA</button>
          <button class="chip" type="button">What is the difference between let and const?</button>
        </div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="input" class="sr-only">Your message</label>
      <textarea id="input" rows="1" placeholder="Type your message" maxlength="2000"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
